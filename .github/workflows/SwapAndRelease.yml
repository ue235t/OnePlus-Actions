name: Swap and Release
on:
  repository_dispatch:
    types: [kernel_swap_final]

env:
  FEIL: ${{ github.event.client_payload.FEIL || 'oneplus_ace5_b' }}
  KERNEL_VERSION: ${{ github.event.client_payload.KERNEL_VERSION || '6.1' }}
  ANDROID_VERSION: ${{ github.event.client_payload.ANDROID_VERSION || 'android14' }}
  SUSFS: ${{ github.event.client_payload.SUSFS || 'On' }}
  RUN_ID: ${{ github.event.client_payload.RUN_ID || '29919246300' }}

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug payload
        run: |
          echo "FEIL=$FEIL"
          echo "KERNEL_VERSION=$KERNEL_VERSION"
          echo "SUSFS=$SUSFS"
          echo "RUN_ID=$RUN_ID"

      - name: Compute artifact name
        id: artifact_name
        run: |
          FEIL="$FEIL"
          KV="$KERNEL_VERSION"
          SUS="$SUSFS"
          if [ "$KV" = "6.1" ]; then
            BASE="${FEIL}_SukiSU_Ultra_lz4_zstd_v1"
          elif [ "$KV" = "6.6" ]; then
            BASE="${FEIL}_SukiSU_Ultra_lz4_v1"
          else
            BASE="${FEIL}_SukiSU_Ultra_v1"
          fi
          if [ "$SUS" = "On" ]; then
            ARTIFACT="${BASE}_SUSFS"
          else
            ARTIFACT="$BASE"
          fi
          echo "ARTIFACT_NAME=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "ARTIFACT_NAME=$ARTIFACT"

      - name: Download stock boot_a.img
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          ls -lh boot_a.img

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          repo: ue235t/OnePlus-Actions
          name: ${{ steps.artifact_name.outputs.ARTIFACT_NAME }}
          path: artifact
          github-token: ${{ github.token }}

      - name: Show files
        run: |
          find artifact/ -type f | head -10
          echo "---"
          ls -lh boot_a.img

      - name: Inspect artifact structure
        run: |
          echo "=== artifact root ==="
          ls -lhR artifact/ 2>&1 | head -30
          echo ""
          echo "=== check for zip files ==="
          find artifact/ -name "*.zip" -ls

      - name: Find Image
        id: find_image
        run: |
          # First try direct find
          IMG=$(find artifact/ -name "Image" 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Found directly: $IMG"
            echo "IMAGE_PATH=$IMG" >> $GITHUB_OUTPUT
            ls -lh "$IMG"
            echo "BOOT_SIZE=$(stat -c%s boot_a.img)" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Try extracting nested zips
          for zip in $(find artifact/ -name "*.zip" 2>/dev/null); do
            echo "Extracting: $zip"
            unzip -o "$zip" -d artifact/extracted/ 2>&1 | tail -3
          done
          IMG=$(find artifact/extracted/ -name "Image" 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Found after extract: $IMG"
            echo "IMAGE_PATH=$IMG" >> $GITHUB_OUTPUT
            ls -lh "$IMG"
            echo "BOOT_SIZE=$(stat -c%s boot_a.img)" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "ERROR: No Image found anywhere"
          find artifact/ -type f | head -20
          exit 1

      - name: Replace kernel using grep + byte-range
        run: |
          python3 << 'PYEOF'
          import struct, os, sys, subprocess

          BOOT_IMG   = "boot_a.img"
          NEW_KERNEL = "${{ steps.find_image.outputs.IMAGE_PATH }}"
          OUT_IMG    = "new_boot_a.img"
          BOOT_SIZE  = int("${{ steps.find_image.outputs.BOOT_SIZE }}")

          # ── 1. Find kernel blob in boot.img using grep ──────────────────
          # ELF magic = 0x7f 'E' 'L' 'F'
          print("Scanning for ELF header in boot_a.img...")
          result = subprocess.run(
              ['grep', '-aob', '\x7fELF', BOOT_IMG],
              capture_output=True, text=True
          )
          matches = []
          for line in result.stdout.strip().split('\n'):
              if not line.strip(): continue
              try:
                  off = int(line.split(':')[0])
                  matches.append(off)
              except: pass

          if not matches:
              print("ERROR: No ELF header found in boot_a.img!")
              sys.exit(1)

          kernel_offset = matches[0]
          print(f"Found ELF at offset 0x{kernel_offset:x} ({kernel_offset>>20}MB)")

          # ── 2. Read ELF header to get kernel size ─────────────────────────
          with open(NEW_KERNEL, "rb") as f:
              elf = bytearray(f.read(64))
          e_shoff = struct.unpack_from("<Q", elf, 40)[0]  # section header offset
          e_shentsize = struct.unpack_from("<H", elf, 58)[0]  # section header entry size
          e_shnum = struct.unpack_from("<H", elf, 60)[0]     # number of sections

          # Find the last section to determine EOF
          max_off = 0
          with open(NEW_KERNEL, "rb") as f:
              for i in range(e_shnum):
                  off = e_shoff + i * e_shentsize
                  f.seek(off)
                  shdr = bytearray(f.read(e_shentsize))
                  sh_offset = struct.unpack_from("<Q", shdr, 24)[0]
                  sh_size   = struct.unpack_from("<Q", shdr, 32)[0]
                  end_off = sh_offset + sh_size
                  if end_off > max_off:
                      max_off = end_off

          new_ksize = os.path.getsize(NEW_KERNEL)
          print(f"New kernel size (file): {new_ksize>>20}MB ({new_ksize} bytes)")

          # ── 3. Read current kernel from boot_a.img (to get its size) ──────
          with open(BOOT_IMG, "rb") as f:
              f.seek(kernel_offset)
              cur_elf = bytearray(f.read(64))

          cur_e_shoff = struct.unpack_from("<Q", cur_elf, 40)[0]
          cur_e_shentsize = struct.unpack_from("<H", cur_elf, 58)[0]
          cur_e_shnum = struct.unpack_from("<H", cur_elf, 60)[0]

          # Find end of old kernel by scanning for FDT magic (0xD00DFEED, big-endian)
          # In Android boot images the kernel is followed by a flat device tree
          with open(BOOT_IMG, "rb") as f:
              f.seek(kernel_offset)
              # Search within first 50MB after kernel start for FDT magic
              search_buf = f.read(min(50*1024*1024, BOOT_SIZE - kernel_offset))
          
          old_ksize = 0
          fdt_magic = b'\xd0\x0d\xfe\xed'
          idx = search_buf.find(fdt_magic)
          if idx >= 0:
              old_ksize = idx
              print(f"Found FDT magic at offset {idx} from kernel start")
          
          if old_ksize == 0:
              # Fallback: assume kernel takes 35MB (0x2300000)
              old_ksize = 0x2300000
              print(f"No FDT found, using fallback old_ksize=0x{old_ksize:x}")
          print(f"Old kernel size: {old_ksize>>20}MB")

          # ── 4. Write new boot image ──────────────────────────────────────
          total_new = kernel_offset + new_ksize
          print(f"New total: {total_new>>20}MB (0x{total_new:x})")
          if total_new > BOOT_SIZE:
              print(f"ERROR: new kernel too large! {new_ksize} + header {kernel_offset} > {BOOT_SIZE}")
              sys.exit(1)

          with open(BOOT_IMG, "rb") as fi:
              with open(OUT_IMG, "wb") as fo:
                  # Copy everything up to old kernel
                  fo.write(fi.read(kernel_offset))
                  # Write new kernel
                  new_kdata = open(NEW_KERNEL, "rb").read()
                  fo.write(new_kdata)
                  # Copy rest of boot image (after old kernel)
                  fi.seek(kernel_offset + old_ksize)
                  while True:
                      chunk = fi.read(2*1024*1024)
                      if not chunk: break
                      fo.write(chunk)

          out_sz = os.path.getsize(OUT_IMG)
          print(f"\nDone! new_boot_a.img = {out_sz>>20}MB ({out_sz} bytes)")
          print(f"Boot size: {BOOT_SIZE>>20}MB")
          PYEOF

      - name: Upload new_boot_a.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: new_boot_a_SUSFS
          path: new_boot_a.img
          retention-days: 5
          compression-level: 0
