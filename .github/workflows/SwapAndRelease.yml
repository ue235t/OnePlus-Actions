name: 'Swap and Release'
on:
  repository_dispatch:
    types: [kernel_swap_final]

jobs:
  swap:
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Compute all needed variables
      - name: Compute build parameters
        id: params
        run: |
          FEIL="${{ vars.FEIL || 'oneplus_ace5_b' }}"
          KV="${{ vars.KERNEL_VERSION || '6.1' }}"
          SUS="${{ vars.SUSFS || 'On' }}"
          RUN_ID="${{ vars.KERNEL_RUN_ID || '29919246300' }}"
          if [ "$KV" = "6.1" ]; then
            BASE="${FEIL}_SukiSU_Ultra_lz4_zstd_v1"
          elif [ "$KV" = "6.6" ]; then
            BASE="${FEIL}_SukiSU_Ultra_lz4_v1"
          else
            BASE="${FEIL}_SukiSU_Ultra_v1"
          fi
          if [ "$SUS" = "On" ]; then
            ARTIFACT="${BASE}_SUSFS"
          else
            ARTIFACT="$BASE"
          fi
          echo "ARTIFACT_NAME=$ARTIFACT"
          echo "RUN_ID=$RUN_ID"
          echo "FEIL=$FEIL"
          echo "ARTIFACT_NAME=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "FEIL=$FEIL" >> $GITHUB_OUTPUT

      # Step 2: Download stock boot image
      - name: Download stock boot_a.img
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          echo "BOOT_SIZE=$(stat -c%s boot_a.img)" >> $GITHUB_OUTPUT
          ls -lh boot_a.img

      # Step 3: Download kernel artifact
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.params.outputs.ARTIFACT_NAME }}
          run-id: ${{ steps.params.outputs.RUN_ID }}
          path: artifact

      # Step 4: Find Image inside artifact
      - name: Find Image
        id: find_image
        run: |
          IMG="artifact/Image"
          if [ ! -f "$IMG" ]; then
            ZIP=$(find artifact/ -name "*.zip" | head -1)
            if [ -n "$ZIP" ]; then
              echo "Found zip: $ZIP"
              unzip -o "$ZIP" Image -d artifact_extracted/
              IMG="artifact_extracted/Image"
            fi
          fi
          echo "Found Image: $IMG"
          echo "IMAGE_PATH=$IMG" >> $GITHUB_OUTPUT
          ls -lh "$IMG"

      - name: Inspect artifact structure
        run: |
          echo "=== artifact root ==="
          ls -lhR artifact/ 2>&1 | head -30
          echo ""
          echo "=== check for zip files ==="
          find artifact/ -name "*.zip" -ls

      - name: Replace kernel (safe in-place)
        run: |
          python3 << 'PYEOF'
          import struct, os, sys, subprocess

          BOOT_IMG   = "boot_a.img"
          NEW_KERNEL = "${{ steps.find_image.outputs.IMAGE_PATH }}"
          OUT_IMG    = "new_boot_a.img"

          # ── 1. Read the ENTIRE boot image into memory ──────────────────────
          print("Reading full boot image into memory...")
          with open(BOOT_IMG, "rb") as f:
              boot_data = bytearray(f.read())
          BOOT_SIZE = len(boot_data)
          print(f"Boot image size: {BOOT_SIZE>>20}MB ({BOOT_SIZE} bytes)")

          # ── 2. Find kernel offset via grep ──────────────────────────────────
          result = subprocess.run(
              ['grep', '-aob', '\x7fELF', BOOT_IMG],
              capture_output=True, text=True
          )
          matches = []
          for line in result.stdout.strip().split('\n'):
              if not line.strip(): continue
              try:
                  off = int(line.split(':')[0])
                  matches.append(off)
              except: pass

          if not matches:
              print("ERROR: No ELF header found!")
              sys.exit(1)

          kernel_offset = matches[0]
          print(f"Kernel ELF at offset 0x{kernel_offset:x} ({kernel_offset>>20}MB)")

          # ── 3. Read boot image header to get kernel_size ────────────────────
          # Android boot img header (2KB page):
          #   0x00: magic "ANDROID!"
          #   0x04: kernel_size (uint32, little-endian)
          #   0x08: kernel_addr (uint32)
          header = boot_data[:4096]
          magic = header[:8]
          if magic[:7] == b'ANDROID':
              kernel_size_hdr = struct.unpack_from("<I", header, 0x04)[0]
              kernel_addr     = struct.unpack_from("<I", header, 0x08)[0]
              print(f"Header kernel_size: {kernel_size_hdr>>20}MB ({kernel_size_hdr} bytes)")
              print(f"Kernel addr: 0x{kernel_addr:08x}")
          
          new_ksize = os.path.getsize(NEW_KERNEL)
          print(f"New kernel size: {new_ksize>>20}MB ({new_ksize} bytes)")

          # ── 4. Update header kernel_size to match new kernel ────────────────
          if magic[:7] == b'ANDROID':
              struct.pack_into("<I", boot_data, 0x04, new_ksize)
              print(f"Updated header kernel_size: {new_ksize} bytes")

          # ── 5. Overwrite kernel region in-place in memory ───────────────────
          with open(NEW_KERNEL, "rb") as f:
              new_kdata = f.read()
          
          end_offset = kernel_offset + new_ksize
          if end_offset > len(boot_data):
              boot_data.extend(b'\x00' * (end_offset - len(boot_data)))
          
          boot_data[kernel_offset:end_offset] = new_kdata
          print(f"Kernel written: offset=0x{kernel_offset:x}, size={new_ksize>>20}MB")
          
          if kernel_size_hdr and kernel_size_hdr > 0:
              overlap = max(0, end_offset - (kernel_offset + kernel_size_hdr))
              if overlap > 0:
                  print(f"NOTE: new kernel exceeds old region by {overlap>>20}MB (overwrites FDT/ramdisk area)")
                  print(f"      This is expected on GKI devices — bootloader reads kernel from offset, not size")

          # ── 6. Write output (exactly same size as input) ───────────────────
          with open(OUT_IMG, "wb") as f:
              f.write(boot_data)
          
          out_sz = os.path.getsize(OUT_IMG)
          print(f"\nDone! new_boot_a.img = {out_sz>>20}MB ({out_sz} bytes)")
          if out_sz == BOOT_SIZE:
              print("OK: Output size matches input — safe to flash")
          else:
              print(f"WARN: Size mismatch! Input={BOOT_SIZE}, Output={out_sz}")
          PYEOF

      - name: Upload new_boot_a.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: new_boot_a_SUSFS
          path: new_boot_a.img
          retention-days: 5
          compression-level: 0
