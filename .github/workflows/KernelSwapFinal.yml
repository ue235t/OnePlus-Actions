name: KernelSwap Final
on:
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download stock boot_a.img
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          ls -lh boot_a.img

      - name: Download SUSFS kernel artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 29919246300
          repo: ue235t/OnePlus-Actions
          name: oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS
          path: artifact
          github-token: ${{ github.token }}

      - name: Show artifact
        run: |
          find artifact/ -type f | head -10
          ls -lh artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS/ 2>/dev/null || ls -lh artifact/

      - name: Replace kernel
        run: |
          python3 << 'PYEOF'
          import struct, os

          BOOT_IMG = "boot_a.img"
          NEW_KERNEL = "artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS/Image"
          if not os.path.exists(NEW_KERNEL):
              NEW_KERNEL = "artifact/Image"
          OUT_IMG = "new_boot_a.img"

          with open(BOOT_IMG, "rb") as f:
              hdr = bytearray(f.read(8192))

          page_size      = struct.unpack_from("<I", hdr, 0)[0]
          kernel_offset  = struct.unpack_from("<I", hdr, 8)[0]
          kernel_size    = struct.unpack_from("<I", hdr, 16)[0]
          ramdisk_offset = struct.unpack_from("<I", hdr, 24)[0]
          ramdisk_size   = struct.unpack_from("<I", hdr, 32)[0]
          second_offset  = struct.unpack_from("<I", hdr, 36)[0]
          hdr_ver        = struct.unpack_from("<I", hdr, 60)[0]

          print(f"hdr_ver={hdr_ver}  kernel: offset=0x{kernel_offset:x}  size=0x{kernel_size:x}")
          print(f"ramdisk: offset=0x{ramdisk_offset:x}  second: offset=0x{second_offset:x}")

          new_kdata = open(NEW_KERNEL, "rb").read()
          new_ksize = len(new_kdata)
          print(f"New kernel: {new_ksize//1024//1024}MB")

          with open(BOOT_IMG, "rb") as fi:
              with open(OUT_IMG, "wb") as fo:
                  fi.seek(0)
                  fo.write(fi.read(kernel_offset + kernel_size))
                  fo.write(new_kdata)
                  cur = kernel_offset + new_ksize
                  pagesz = page_size
                  if cur % pagesz:
                      pad = pagesz - (cur % pagesz)
                      fo.write(b'\x00' * pad)
                      cur += pad
                  if second_offset > 0:
                      fi.seek(second_offset)
                  else:
                      fi.seek(cur)
                  while True:
                      chunk = fi.read(1024*1024)
                      if not chunk: break
                      fo.write(chunk)

          with open(OUT_IMG, "r+b") as f:
              f.seek(16)
              f.write(struct.pack("<I", new_ksize))

          sz = os.path.getsize(OUT_IMG)
          print(f"Done! new_boot_a.img = {sz//1024//1024}MB")
          PYEOF

      - name: Upload to GitHub Release via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get or create release for tag susfs-ready
          TAG="susfs-ready"
          OWNER="ue235t"
          REPO="OnePlus-Actions"

          # Try to get existing release
          REL=$(gh api repos/$OWNER/$REPO/releases/tags/$TAG 2>/dev/null || echo "")
          if [ -z "$REL" ]; then
            echo "Creating new release..."
            gh api repos/$OWNER/$REPO/releases -f tag_name="$TAG" \
              -f name="SUSFS 完整镜像 (fastboot 直接刷入)" \
              -f body="原厂 boot_a.img + SUSFS SukiSU Ultra 内核

刷入方法（手机进入 Fastboot 模式连接电脑）：
\`\`\`
fastboot flash boot_a new_boot_a.img
fastboot set_active a
fastboot reboot
\`\`\`"
          fi

          # Get upload URL
          UPLOAD_URL=$(gh api repos/$OWNER/$REPO/releases/tags/$TAG --jq '.upload_url' | sed 's/{?name,label}//')
          echo "Upload URL: $UPLOAD_URL"

          # Upload the file
          RESP=$(curl -s -w "\\n%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @new_boot_a.img \
            "${UPLOAD_URL}?name=new_boot_a.img")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "201" ]; then
            echo "Upload SUCCESS!"
            echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('URL:', d['browser_download_url'])"
          else
            echo "Upload FAILED: $BODY"
            exit 1
          fi
