name: KernelSwap
on:
  workflow_dispatch:
  repository_dispatch:
    types: [kernel_swap]

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download stock boot_a.img
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          ls -lh boot_a.img

      - name: Download SUSFS kernel artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 29919246300
          repo: ue235t/OnePlus-Actions
          name: oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS
          path: artifact
          github-token: ${{ github.token }}

      - name: Inspect files
        run: |
          find artifact/ -type f | head -10
          echo "---"
          ls -lh boot_a.img

      - name: Replace kernel (pure Python)
        run: |
          python3 << 'PYEOF'
          import struct, os, sys

          BOOT_IMG   = "boot_a.img"
          KERNEL_DIR = "artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS"
          NEW_KERNEL = os.path.join(KERNEL_DIR, "Image")
          if not os.path.exists(NEW_KERNEL):
              NEW_KERNEL = "artifact/Image"
          OUT_IMG = "new_boot_a.img"

          # ── read boot header ──────────────────────────────────────────────
          with open(BOOT_IMG, "rb") as f:
              hdr = bytearray(f.read(8192))

          page_size      = struct.unpack_from("<I", hdr, 0)[0]
          kernel_offset  = struct.unpack_from("<I", hdr, 8)[0]
          kernel_size    = struct.unpack_from("<I", hdr, 16)[0]
          ramdisk_offset = struct.unpack_from("<I", hdr, 24)[0]
          ramdisk_size   = struct.unpack_from("<I", hdr, 32)[0]
          second_offset  = struct.unpack_from("<I", hdr, 36)[0]
          hdr_ver        = struct.unpack_from("<I", hdr, 60)[0]

          print(f"page_size=0x{page_size:x}")
          print(f"kernel:  offset=0x{kernel_offset:x}  size=0x{kernel_size:x} ({kernel_size>>20}MB)")
          print(f"ramdisk: offset=0x{ramdisk_offset:x}")
          print(f"second:  offset=0x{second_offset:x}")
          print(f"hdr_ver={hdr_ver}")

          # ── read new kernel ────────────────────────────────────────────────
          new_kdata = open(NEW_KERNEL, "rb").read()
          new_ksize = len(new_kdata)
          print(f"\nNew kernel: {new_ksize>>20}MB ({new_ksize} bytes)")

          # ── sanity check ───────────────────────────────────────────────────
          available = ramdisk_offset - kernel_offset
          if new_ksize > available:
              print(f"FATAL: kernel too large! {new_ksize} > {available}")
              sys.exit(1)

          # ── build new image ────────────────────────────────────────────────
          with open(BOOT_IMG, "rb") as fi:
              with open(OUT_IMG, "wb") as fo:
                  # header + old kernel
                  fi.seek(0)
                  fo.write(fi.read(kernel_offset + kernel_size))
                  # new kernel
                  fo.write(new_kdata)
                  # pad to next page boundary
                  cur = kernel_offset + new_ksize
                  if cur % page_size:
                      pad = page_size - (cur % page_size)
                      fo.write(b'\x00' * pad)
                      cur += pad
                  print(f"After kernel+pad: 0x{cur:x} (0x{cur>>20}MB)")
                  # copy second stage + ramdisk + rest from second_offset
                  start = second_offset if second_offset else cur
                  fi.seek(start)
                  while True:
                      chunk = fi.read(2*1024*1024)
                      if not chunk: break
                      fo.write(chunk)

          # ── update kernel_size in header ───────────────────────────────────
          with open(OUT_IMG, "r+b") as f:
              f.seek(16)
              f.write(struct.pack("<I", new_ksize))

          out_sz = os.path.getsize(OUT_IMG)
          boot_sz = os.path.getsize(BOOT_IMG)
          print(f"\nDone!")
          print(f"  new_boot_a.img  = {out_sz>>20}MB")
          print(f"  boot_a.img      = {boot_sz>>20}MB")
          PYEOF

      - name: Upload via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="susfs-ready"
          OWNER="ue235t"
          REPO="OnePlus-Actions"

          # Delete existing release if any
          REL_ID=$(gh api repos/$OWNER/$REPO/releases/tags/$TAG --jq '.id' 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            echo "Deleting old release $REL_ID..."
            gh api -X DELETE repos/$OWNER/$REPO/releases/$REL_ID
          fi

          # Create release
          gh api repos/$OWNER/$REPO/releases \
            -f tag_name="$TAG" \
            -f name="SUSFS 完整镜像 (fastboot 直接刷入)" \
            -f body="**new_boot_a.img** = 原厂 boot_a + SUSFS SukiSU Ultra 内核

刷入方法（手机进入 Fastboot 模式）：
\`\`\`
fastboot flash boot_a new_boot_a.img
fastboot set_active a
fastboot reboot
\`\`\`"

          # Get upload URL
          UPLOAD_URL=$(gh api repos/$OWNER/$REPO/releases/tags/$TAG --jq '.upload_url' | tr -d '"' | sed 's/{?name,label}//')
          echo "Upload URL: $UPLOAD_URL"

          # Upload file
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @new_boot_a.img \
            "${UPLOAD_URL}?name=new_boot_a.img")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "201" ]; then
            echo "SUCCESS! File uploaded."
            gh api repos/$OWNER/$REPO/releases/tags/$TAG --jq '.body = .body + "\n\nDownload: " + .zipball_url' > /dev/null 2>&1 || true
          else
            echo "FAILED"
            exit 1
          fi
