name: Make New Boot Image

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'SUSFS kernel artifact ID'
        required: true
        default: '8529683680'
        type: string
  repository_dispatch:
    types: [make_boot]
    inputs:
      artifact_id:
        description: 'SUSFS kernel artifact ID'
        required: true
        default: '8529683680'
        type: string

jobs:
  make-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: mkdir -p $HOME/boot_tool

      - name: Configure Git
        run: |
          git config --global user.name "build"
          git config --global user.email "build@example.com"

      - name: Download boot_a.img from release
        run: |
          cd $HOME/boot_tool
          echo "Downloading boot_a.img..."
          curl -fsSL "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img" -o boot_a.img
          ls -la boot_a.img
          python3 -c "
import struct
d=open('boot_a.img','rb').read()
print('Size:', len(d), 'bytes (%.1f MB)' % (len(d)/1024/1024))
print('Magic:', d[0:8])
print('Kernel size:', struct.unpack_from('<I',d,8)[0])
print('Header ver:', struct.unpack_from('<I',d,40)[0])
"

      - name: Download kernel artifact
        run: |
          cd $HOME/boot_tool
          echo "Downloading artifact ${{ github.event.inputs.artifact_id }}..."
          gh run download ${{ github.event.inputs.artifact_id }} -R ue235t/OnePlus-Actions --dir kernel_artifact/
          ls -la kernel_artifact/

      - name: Extract Image
        run: |
          cd $HOME/boot_tool
          mkdir -p kernel_out
          unzip -o kernel_artifact/*.zip -d extracted/
          # Find Image file
          IMG=$(find extracted/ -name "Image" -type f | head -1)
          echo "Found Image at: $IMG"
          cp "$IMG" kernel_out/Image
          ls -la kernel_out/Image
          python3 -c "
d=open('kernel_out/Image','rb').read()
print('Size:', len(d), 'bytes (%.1f MB)' % (len(d)/1024/1024))
print('Magic:', d[0:4].hex())
import struct
if d[0:4]==b'\x7fELF':
    print('Type: ELF')
    e_entry=struct.unpack_from('<Q',d,24)[0]
    print('Entry: 0x%x' % e_entry)
"

      - name: Replace kernel
        run: |
          cd $HOME/boot_tool
          cat > kernel_replacer.py << 'PYEOF'
#!/usr/bin/env python3
import struct, os

BOOT_IMG = 'boot_a.img'
NEW_KERNEL = 'kernel_out/Image'
OUT_BOOT = 'new_boot.img'

def main():
    print('=== OnePlus Kernel Replacer ===')
    with open(BOOT_IMG, 'rb') as f:
        boot = bytearray(f.read())
    print('Loaded %s: %d bytes' % (BOOT_IMG, len(boot)))
    assert boot[0:8] == b'ANDROID!', 'ERROR: Not Android boot image!'
    
    hdr_version = struct.unpack_from('<I', boot, 40)[0]
    kernel_offset = 0x1000  # page_size=0 => 4096
    header_kernel_size = struct.unpack_from('<I', boot, 8)[0]
    print('Header version: %d' % hdr_version)
    print('Kernel offset: 0x%x' % kernel_offset)
    print('Header kernel_size: %d (%.1f MB)' % (header_kernel_size, header_kernel_size/1024/1024))
    
    kernel_magic = boot[kernel_offset:kernel_offset+4]
    print('Kernel magic: %s' % kernel_magic.hex())
    
    with open(NEW_KERNEL, 'rb') as f:
        new_kernel = f.read()
    new_kernel_sz = len(new_kernel)
    print('New kernel: %d bytes (%.1f MB)' % (new_kernel_sz, new_kernel_sz/1024/1024))
    
    # Build new boot image
    # Ensure enough space
    needed = kernel_offset + new_kernel_sz
    if needed > len(boot):
        # Expand boot image
        new_len = ((needed + 4*1024*1024 - 1) // (4*1024*1024)) * (4*1024*1024)
        new_boot = bytearray(new_len)
        new_boot[:len(boot)] = boot
        print('Expanded boot image: %d -> %d bytes' % (len(boot), new_len))
    else:
        new_boot = bytearray(boot)
    
    # Replace kernel
    new_boot[kernel_offset:kernel_offset+new_kernel_sz] = new_kernel
    # Zero-pad to page boundary
    padded = ((kernel_offset + new_kernel_sz + 4095) // 4096) * 4096
    for i in range(kernel_offset + new_kernel_sz, min(padded, len(new_boot))):
        new_boot[i] = 0
    
    # Update header
    struct.pack_into('<I', new_boot, 8, new_kernel_sz)
    
    # Truncate to last non-zero
    actual_end = len(new_boot)
    for i in range(len(new_boot)-1, -1, -1):
        if new_boot[i] != 0:
            actual_end = i + 1
            break
    actual_end = ((actual_end + 4095) // 4096) * 4096
    new_boot = new_boot[:actual_end]
    
    with open(OUT_BOOT, 'wb') as f:
        f.write(new_boot)
    print('Written: %s (%d bytes / %.1f MB)' % (OUT_BOOT, len(new_boot), len(new_boot)/1024/1024))
    
    # Verify
    with open(OUT_BOOT, 'rb') as f:
        v = f.read()
    assert v[0:8] == b'ANDROID!', 'Verify: header corrupt'
    assert struct.unpack_from('<I', v, 8)[0] == new_kernel_sz, 'Verify: kernel_size wrong'
    assert v[kernel_offset:kernel_offset+4] == new_kernel[0:4], 'Verify: kernel corrupt'
    print('Verification: PASSED')
    print()
    print('SUCCESS! Flash with: fastboot flash boot_a new_boot.img')
    print('Or for both slots: fastboot flash boot_a new_boot.img && fastboot flash boot_b new_boot.img')

if __name__ == '__main__':
    main()
PYEOF
          python3 kernel_replacer.py

      - name: Upload new boot image
        uses: actions/upload-artifact@v7
        with:
          name: new_boot_SUSFS
          path: ${{ github.workspace }}/boot_tool/new_boot.img
          retention-days: 5
