name: KernelSwap V3
on:
  workflow_dispatch:
  repository_dispatch:
    types: [kernel_swap]

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Download stock boot_a.img from release
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          ls -lh boot_a.img

      - name: Download SUSFS kernel artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 29919246300
          repo: ue235t/OnePlus-Actions
          name: oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS
          path: kernel_artifact
          github-token: ${{ github.token }}

      - name: Inspect downloaded files
        run: |
          echo "=== boot_a.img ==="
          ls -lh boot_a.img
          echo ""
          echo "=== kernel_artifact tree ==="
          find kernel_artifact/ -type f | head -30
          ls -lh kernel_artifact/

      - name: Replace kernel in boot image
        run: |
          python3 << 'PYEOF'
          import struct, os, sys

          BOOT_IMG = "boot_a.img"

          # Find the Image file - check artifact directory
          possible_paths = [
              "kernel_artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS/Image",
              "kernel_artifact/Image",
              "kernel_artifact/kernel_artifact/Image",
          ]
          NEW_KERNEL = None
          for p in possible_paths:
              if os.path.exists(p):
                  NEW_KERNEL = p
                  break
          if not NEW_KERNEL:
              # Try to find it recursively
              for root, dirs, files in os.walk("kernel_artifact"):
                  if "Image" in files:
                      NEW_KERNEL = os.path.join(root, "Image")
                      break
          if not NEW_KERNEL:
              print("ERROR: No Image file found!")
              print("Files found:", list(os.walk("kernel_artifact")))
              sys.exit(1)

          OUT_IMG = "new_boot_a.img"
          print(f"Kernel: {NEW_KERNEL}")
          print(f"Size: {os.path.getsize(NEW_KERNEL)/1024/1024:.1f} MB")

          with open(BOOT_IMG, "rb") as f:
              header = bytearray(f.read(4096))

          page_size = struct.unpack_from("<I", header, 0)[0]
          kernel_offset = struct.unpack_from("<I", header, 8)[0]
          kernel_size = struct.unpack_from("<I", header, 16)[0]
          ramdisk_offset = struct.unpack_from("<I", header, 24)[0]
          ramdisk_size = struct.unpack_from("<I", header, 32)[0]
          header_version = struct.unpack_from("<I", header, 60)[0]

          print(f"page_size={page_size} (0x{page_size:x})")
          print(f"kernel_offset=0x{kernel_offset:x}, kernel_size={kernel_size} ({kernel_size/1024/1024:.1f} MB)")
          print(f"ramdisk_offset=0x{ramdisk_offset:x}, ramdisk_size={ramdisk_size}")
          print(f"header_version={header_version}")

          new_kernel_data = open(NEW_KERNEL, "rb").read()
          new_kernel_size = len(new_kernel_data)
          available = ramdisk_offset - kernel_offset

          print(f"\nNew kernel: {new_kernel_size/1024/1024:.1f} MB")
          print(f"Available: {available/1024/1024:.1f} MB")

          if new_kernel_size > available:
              print(f"FATAL: Kernel too large!")
              sys.exit(1)

          with open(BOOT_IMG, "rb") as f_in:
              with open(OUT_IMG, "wb") as f_out:
                  f_out.write(f_in.read(kernel_offset))
                  f_out.write(new_kernel_data)
                  current = kernel_offset + new_kernel_size
                  if current < ramdisk_offset:
                      pad = ramdisk_offset - current
                      f_out.write(b'\x00' * pad)
                      print(f"Padded {pad} bytes")
                  f_in.seek(ramdisk_offset)
                  while True:
                      chunk = f_in.read(1024*1024)
                      if not chunk: break
                      f_out.write(chunk)

          # Update kernel_size in header
          with open(OUT_IMG, "r+b") as f:
              f.seek(16)
              f.write(struct.pack("<I", new_kernel_size))

          out_sz = os.path.getsize(OUT_IMG)
          print(f"\nDone! Output: {out_sz/1024/1024:.1f} MB")
          PYEOF

      - name: Upload new boot image to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs-ready
          name: "SUSFS Kernel (pre-patched, ready to flash)"
          body: |
            **new_boot_a.img** = stock boot_a + SUSFS kernel pre-installed.

            Flash via fastboot:
            ```
            fastboot flash boot_a new_boot_a.img
            fastboot set_active a
            fastboot reboot
            ```
          files: |
            new_boot_a.img
          draft: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
