name: KernelSwap V3
on:
  workflow_dispatch:
  repository_dispatch:
    types: [kernel_swap]

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Download boot_a.img (stock)
        run: |
          wget -q -O boot_a.img "https://github.com/ue235t/OnePlus-Actions/releases/download/ak3-initboot/boot_a.img"
          ls -lh boot_a.img

      - name: Download new SUSFS kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 29919246300 -R ue235t/OnePlus-Actions --dir ./kernel_artifact/
          ls -la kernel_artifact/

      - name: Inspect files
        run: |
          echo "=== boot_a.img header (first 4KB) ==="
          xxd boot_a.img | head -16
          echo ""
          echo "=== kernel_artifact contents ==="
          ls -lh kernel_artifact/
          echo ""
          echo "=== Image magic ==="
          xxd kernel_artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS/Image | head -4

      - name: Replace kernel in boot image
        run: |
          python3 << 'PYEOF'
          import struct, os, sys

          BOOT_IMG = "boot_a.img"
          NEW_KERNEL = "kernel_artifact/oneplus_ace5_b_SukiSU_Ultra_lz4_zstd_v1_SUSFS/Image"
          OUT_IMG = "new_boot_a.img"

          with open(BOOT_IMG, "rb") as f:
              header = bytearray(f.read(4096))

          page_size = struct.unpack_from("<I", header, 0)[0]
          kernel_offset = struct.unpack_from("<I", header, 8)[0]
          kernel_size = struct.unpack_from("<I", header, 16)[0]
          ramdisk_offset = struct.unpack_from("<I", header, 24)[0]
          ramdisk_size = struct.unpack_from("<I", header, 32)[0]
          header_version = struct.unpack_from("<I", header, 60)[0]
          os_version = struct.unpack_from("<I", header, 40)[0]
          os_patch_level = struct.unpack_from("<I", header, 44)[0]

          print(f"page_size={page_size} (0x{page_size:x})")
          print(f"kernel_offset=0x{kernel_offset:x}, kernel_size={kernel_size} (0x{kernel_size:x})")
          print(f"ramdisk_offset=0x{ramdisk_offset:x}, ramdisk_size={ramdisk_size}")
          print(f"header_version={header_version}")
          print(f"os_version=0x{os_version:x}, os_patch=0x{os_patch_level:x}")

          new_kernel_size = os.path.getsize(NEW_KERNEL)
          print(f"\nNew kernel size: {new_kernel_size} (0x{new_kernel_size:x})")
          print(f"Available space before ramdisk: {ramdisk_offset - kernel_offset}")
          print(f"Old kernel size: {kernel_size} (0x{kernel_size:x})")

          available = ramdisk_offset - kernel_offset
          if new_kernel_size > available:
              print(f"FATAL: New kernel too large! Available: {available}, needed: {new_kernel_size}")
              sys.exit(1)

          new_kernel_data = open(NEW_KERNEL, "rb").read()
          print(f"Read new kernel: {len(new_kernel_data)} bytes")

          with open(BOOT_IMG, "rb") as f_in:
              with open(OUT_IMG, "wb") as f_out:
                  # Copy header (page 0)
                  f_out.write(f_in.read(kernel_offset))
                  # Write new kernel
                  f_out.write(new_kernel_data)
                  # Pad to ramdisk
                  current = kernel_offset + new_kernel_size
                  if current < ramdisk_offset:
                      pad = ramdisk_offset - current
                      f_out.write(b'\x00' * pad)
                      print(f"Padded {pad} bytes")
                  # Copy ramdisk + rest
                  f_in.seek(ramdisk_offset)
                  while True:
                      chunk = f_in.read(1024*1024)
                      if not chunk:
                          break
                      f_out.write(chunk)

          # Update kernel_size in header
          with open(OUT_IMG, "r+b") as f:
              f.seek(16)
              f.write(struct.pack("<I", new_kernel_size))
          print(f"Updated kernel_size: {kernel_size} -> {new_kernel_size}")

          out_sz = os.path.getsize(OUT_IMG)
          print(f"\nDone! Output: {out_sz} bytes ({out_sz/1024/1024:.1f} MB)")
          PYEOF

      - name: Upload new boot image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs-ready
          name: "SUSFS Kernel (ready to fastboot flash)"
          body: "**new_boot_a.img** = stock boot_a + SUSFS kernel pre-installed.\n\nFlash via fastboot:\n```\nfastboot flash boot_a new_boot_a.img\nfastboot set_active a\nfastboot reboot\n```\n\nThen check in SukiSU Ultra manager: SUSFS status should show green."
          files: |
            new_boot_a.img
          draft: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
