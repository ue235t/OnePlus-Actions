name: Build SukiSU Ultra
on:
  repository_dispatch:
    types: [build_event]
  workflow_dispatch:
    inputs:
    
      CPU:
        description: "CPU鍒嗘敮"
        required: true
        type: choice
        options:
          - 'sm8750'
          - 'sm8735'
          - 'mt6991'
          - 'sm8650'
          - 'mt6989'
          - 'sm8635'
          - 'sm8550'
          - 'sm8450'
          - 'sm8475'
          - 'sm7675'
          - 'sm7635'
          - 'sm7550'
          - 'sm6375'
        default: 'sm8650'
        
      FEIL:
        description: "鎵嬫満鍨嬪彿"
        required: true
        type: choice
        options:
          - 'oneplus_13_b'
          - 'oneplus_13s_b'
          - 'oneplus_13t_b'
          - 'oneplus_ace5_pro_b'
          - 'oneplus_ace_6'
          - 'oneplus_pad_2_pro_b'
          - 'oneplus_pad_3_b'
          - 'oneplus_ace5_ultra_b'
          - 'oneplus_nord_6'
          - 'oneplus_turbo_6'
          - 'oneplus_12_b'
          - 'oneplus_ace3_pro_b'
          - 'oneplus_ace5'
          - 'oneplus_ace5_b'
          - 'oneplus_13r_b'
          - 'oneplus_pad2_b'
          - 'oneplus_pad_pro_b'
          - 'oneplus_ace5_race_b'
          - 'oneplus_nord_5_b'
          - 'oneplus_11_b'
          - 'oneplus_12r_b'
          - 'oneplus_ace2_pro_b'
          - 'oneplus_ace3_b'
          - 'oneplus_open_b'
          - 'oneplus_10t_v'
          - 'oneplus_11r_b'
          - 'oneplus_ace2_b'
          - 'oneplus_ace_pro_v'
          - 'oneplus_10_pro_b'
          - 'oneplus_ace_3v_b'
          - 'oneplus_turbo_6v'
          - 'oneplus_nord_4_b'
          - 'oneplus_nord_ce4_lite_5g'
          - 'oneplus_nord_ce4_b'
        default: 'oneplus_12_b'
        
      ANDROID_VERSION:
        description: "鍐呮牳瀹夊崜KMI鐗堟湰"
        required: true
        type: choice
        options:
          - 'android15'
          - 'android14'
          - 'android13'
          - 'android12'
        default: 'android14'
        
      KERNEL_VERSION:
        description: "鍐呮牳鐗堟湰"
        required: true
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
        default: '6.1'

      SUSFS:
        description: "鏄惁鍚敤SUSFS"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      KPM:
        description: "鏄惁鍚敤KPM"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'
       
      lz4kd:
        description: "鏄惁鍚敤lz4kd(6.1 鍏抽棴鏃朵娇鐢?lz4 + zstd; 6.6 鍏抽棴鏃朵娇鐢?lz4)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      bbg:
        description: "鏄惁鍚敤BBG鍩哄甫淇濇姢"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'
       
      bbr:
        description: "鏄惁鍚敤BBR绠楁硶(瀵规墜鏈烘棩鐢ㄦ棤澶ぇ鎰忎箟鐢氳嚦鍙兘璐熶紭鍖?"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      proxy:
        description: "鏄惁娣诲姞浠ｇ悊鎬ц兘浼樺寲(鑱斿彂绉戣姱鐗囪窇鐨勬椂鍊欒鍏抽棴鍚﹀垯鍑虹幇鎭舵€ч棶棰?"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

      UNICODE_BYPASS:
        description: "鏄惁娣诲姞Unicode闆跺缁曡繃淇琛ヤ竵(闄?.10鐗堟湰澶栫増鏈笉鎺ㄨ崘寮€鍚? 寤鸿浣跨敤 https://t.me/real5ec1cff/271 鏃犵棝淇)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      CVE_2026_43499:
        description: "鏄惁搴旂敤 CVE-2026-43499 rtmutex 淇琛ヤ竵"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'
         
jobs:
  build:
    name: For ${{ github.event.client_payload.FEIL }} KPM ${{ github.event.client_payload.KPM }} lz4kd ${{ github.event.client_payload.lz4kd }} SUSFS ${{ github.event.client_payload.SUSFS }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      
    steps:
      - name: "馃殌 Maximize Build Space | 鏈€澶у寲鏋勫缓绌洪棿"
        if: ${{ github.event.client_payload.KERNEL_VERSION == '5.10' || github.event.client_payload.KERNEL_VERSION == '5.15' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "馃摜 Checkout Builder | 妫€鍑烘瀯寤鸿剼鏈?
        uses: actions/checkout@v4

      - name: "鈿欙笍 Setup Cache Env | 璁剧疆缂撳瓨鐜"
        run: |
          echo "馃敡 姝ｅ湪璁剧疆鏈哄瀷闅旂缂撳瓨鐩綍..."
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.client_payload.FEIL }}_SukiSU" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.client_payload.FEIL }}_SukiSU"
          echo "鉁?缂撳瓨鐩綍宸茶缃? $HOME/.ccache_${{ github.event.client_payload.FEIL }}_SukiSU"

      - name: "馃攼 Configure Git | 閰嶇疆Git璐︽埛"
        run: |
          echo "馃敡 姝ｅ湪閰嶇疆Git鐢ㄦ埛淇℃伅..."
          git config --global user.name "build"
          git config --global user.email "2210077278@qq.com"
          echo "鉁?Git閰嶇疆瀹屾垚"

      - name: "馃摝 Cache & Install Dependencies | 缂撳瓨 & 瀹夎鏋勫缓渚濊禆"
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts: true

      - name: "馃捑 Restore ccache (With SUSFS) | 鎭㈠ccache缂撳瓨 (With SUSFS)"
        if: ${{ github.event.client_payload.SUSFS == 'On' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.client_payload.FEIL }}-SukiSU-SUSFS
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.client_payload.FEIL }}-SukiSU-SUSFS
            ccache-${{ runner.os }}-SukiSU-SUSFS

      - name: "馃捑 Restore ccache (Without SUSFS) | 鎭㈠ccache缂撳瓨 (Without SUSFS)"
        if: ${{ github.event.client_payload.SUSFS == 'Off' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.client_payload.FEIL }}-SukiSU-NoSUSFS
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.client_payload.FEIL }}-SukiSU-NoSUSFS
            ccache-${{ runner.os }}-SukiSU-NoSUSFS

      - name: "鈿欙笍 Initialize ccache | 鍒濆鍖朿cache"
        run: |
          echo "馃敡 姝ｅ湪鍒濆鍖朿cache..."
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "鉁?ccache鍒濆鍖栧畬鎴?
            else
              echo "鈩癸笍 ccache宸插瓨鍦紝璺宠繃鍒濆鍖?
            fi
          else
            echo "鈿狅笍 鏈壘鍒癱cache鍛戒护锛岃烦杩囧垵濮嬪寲"
          fi
          # 鏄剧ず缂撳瓨缁熻
          ccache -s
          echo "鉁?ccache鍒濆鍖栨祦绋嬪畬鎴?

      - name: "馃摜 Install Repo Tool | 瀹夎Repo宸ュ叿"
        run: |
          echo "猬囷笍 姝ｅ湪涓嬭浇repo宸ュ叿..."
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "鉁?repo宸ュ叿瀹夎瀹屾垚"

      - name: "猬囷笍 Clone Kernel Source | 鍏嬮殕鍐呮牳婧愮爜"
        run: |
          mkdir kernel_workspace && cd kernel_workspace

          echo "馃寪 姝ｅ湪鍒濆鍖栧唴鏍镐粨搴?.."
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.client_payload.CPU }} -m ${{ github.event.client_payload.FEIL }}.xml --depth=1

          echo "馃攧 鍚屾浠ｇ爜搴?浣跨敤$(nproc --all)绾跨▼)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
 
          echo "鉁?鍐呮牳婧愮爜鍏嬮殕瀹屾垚"
     
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

          echo "馃敡 姝ｅ湪閰嶇疆鍐呮牳鐗堟湰淇℃伅..."
          # Remove -dirty in kernel version
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          
          if [ "${{ github.event.client_payload.KERNEL_VERSION }}" != "6.6" ]; then
            sed -i '$s|echo "\$res"|echo "-${{ github.event.client_payload.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/common/scripts/setlocalversion            
            sed -i '$s|echo "\$res"|echo "-${{ github.event.client_payload.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/msm-kernel/scripts/setlocalversion
            sed -i '$s|echo "\$res"|echo "-${{ github.event.client_payload.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/external/dtc/scripts/setlocalversion
          else
            ESCAPED_SUFFIX=$(printf '%s\n' "-${{ github.event.client_payload.ANDROID_VERSION }}-oki-xiaoxiaow" | sed 's:[\/&]:\\&:g')
            sudo sed -i "s/-4k/$ESCAPED_SUFFIX/g" kernel_platform/common/arch/arm64/configs/gki_defconfig
            sed -i 's/${scm_version}//' kernel_platform/common/scripts/setlocalversion
            sed -i 's/${scm_version}//' kernel_platform/msm-kernel/scripts/setlocalversion
          fi

          echo "鉁?鍐呮牳閰嶇疆瀹屾垚"

      - name: "鈿?Setup Baseband-guard | 閰嶇疆 Baseband-guard"
        if: ${{ github.event.client_payload.bbg == 'On' && github.event.client_payload.KPM == 'Off' }}
        run: |
          set -e
          cd kernel_workspace/kernel_platform/common
          echo "馃洜锔?姝ｅ湪璁剧疆BBG..."
          curl -sSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh     
              
      - name: "鈿?Setup SukiSU Ultra | 閰嶇疆 SukiSU Ultra"
        run: |
          cd kernel_workspace/kernel_platform

          # 涓嬭浇骞舵墽琛岃缃剼鏈?          echo "馃洜锔?姝ｅ湪璁剧疆SukiSU Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
          
          cd KernelSU
          echo "猬囷笍 涓嬭浇SukiSU璁剧疆宸ュ叿..."
          curl -L -o sukisu_setup.bin https://github.com/Xiaomichael/OnePlus-Actions/raw/Build/script/sukisu_setup.bin
          chmod +x sukisu_setup.bin
          
          ./sukisu_setup.bin
          rm -rf ./sukisu_setup.bin
          
          echo "鉁?SukiSU Ultra閰嶇疆瀹屾垚"
          
      - name: "馃敡 Setup Patches | 閰嶇疆琛ヤ竵"
        run: |
          cd kernel_workspace

          echo "猬囷笍 鍏嬮殕鎵€闇€琛ヤ竵..."
          if [ "${{ github.event.client_payload.SUSFS }}" == "On" ]; then          
            git clone https://github.com/cctv18/susfs4oki.git -b oki-${{ github.event.client_payload.ANDROID_VERSION }}-${{ github.event.client_payload.KERNEL_VERSION }}
          fi
          git clone https://github.com/Xiaomichael/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          
          cd kernel_platform
          echo "馃摑 澶嶅埗琛ヤ竵鏂囦欢..."
          if [ "${{ github.event.client_payload.SUSFS }}" == "On" ]; then
            cp ../susfs4oki/kernel_patches/50_add_susfs_in_gki-${{ github.event.client_payload.ANDROID_VERSION }}-${{ github.event.client_payload.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4oki/kernel_patches/fs/* ./common/fs/
            cp ../susfs4oki/kernel_patches/include/linux/* ./common/include/linux/
          else
            cp ../kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch ./common/
          fi
          cp ../kernel_patches/zram_patches/001-lz4.patch ./common/
          cp ../kernel_patches/zram_patches/lz4armv8.S ./common/lib
          cp ../kernel_patches/zram_patches/002-zstd.patch ./common/
          if [ "${{ github.event.client_payload.UNICODE_BYPASS }}" = "On" ]; then
            if [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.1" ] || [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.6" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1+.patch ./common/unicode_bypass_fix.patch
            elif [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.15" ] || [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.10" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1-.patch ./common/unicode_bypass_fix.patch
            fi
          fi
          
          if [ "${{ github.event.client_payload.lz4kd }}" == "On" ]; then
            # Copy lz4k from ShirkNeko
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          
          cd ./common

          if [ "${{ github.event.client_payload.CVE_2026_43499 }}" = "On" ]; then
            echo "馃洝锔?姝ｅ湪搴旂敤 CVE-2026-43499 rtmutex 淇琛ヤ竵..."
            bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" "${{ github.event.client_payload.KERNEL_VERSION }}" "$GITHUB_WORKSPACE/security_patch"
          else
            echo "鈩癸笍 璺宠繃 CVE-2026-43499 rtmutex 淇琛ヤ竵"
          fi

          if [ "${{ github.event.client_payload.UNICODE_BYPASS }}" = "On" ]; then
            echo "馃摝 姝ｅ湪搴旂敤Unicode闆跺缁曡繃淇琛ヤ竵..."
            patch -p1 < unicode_bypass_fix.patch
          fi

          if [ "${{ github.event.client_payload.lz4kd }}" = "Off" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.1" ]; then
            echo "馃摝 搴旂敤lz4+zstd琛ヤ竵..."
            git apply -p1 < 001-lz4.patch || true
            patch -p1 < 002-zstd.patch || true
          fi

          if [ "${{ github.event.client_payload.lz4kd }}" = "Off" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.6" ]; then
            echo "馃摝 搴旂敤lz4琛ヤ竵..."
            git apply -p1 < 001-lz4.patch || true
          fi
          
          if [ "${{ github.event.client_payload.lz4kd }}" == "On" ]; then
            echo "馃摝 搴旂敤lz4kd琛ヤ竵..."
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.client_payload.KERNEL_VERSION }}/lz4kd.patch ./
            patch -p1 -F 3 < lz4kd.patch || true
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.client_payload.KERNEL_VERSION }}/lz4k_oplus.patch ./
            patch -p1 -F 3 < lz4k_oplus.patch || true
          fi

          if [ "${{ github.event.client_payload.SUSFS }}" == "On" ]; then
            echo "馃摝 搴旂敤SUSFS琛ヤ竵..."
            fake_patched=0
            fake_patched_expand=0
            if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.6" ]; then
              if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                echo "nr_subpages Line not found. Fake Patching!"
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              fi
              
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              
              if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                echo "#include <linux/zswap.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
              fi
              
              if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
                echo "Temporarily expand the `last_vma_end` `if` block to fix a matching issue."
                perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
                fake_patched_expand=1
              fi
            fi
            if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android12" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.10" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
            fi
            if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android13" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.15" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
              
              if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                echo "#include swap_slots.h> Line found. Deleting header."
                sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
                fake_patched=1
              fi
            fi
            
            if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android14" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.1" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
              
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
            fi
            
            patch -p1 < 50_add_susfs_in_gki-${{ github.event.client_payload.ANDROID_VERSION }}-${{ github.event.client_payload.KERNEL_VERSION }}.patch || true
            
            # Revert Fake kernel patch
            if [ "$fake_patched_expand" = 1 ]; then
              if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.6" ]; then
                if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
                  perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            
            if [ "$fake_patched" = 1 ]; then
              if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.6" ]; then
                if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                  echo "nr_subpages Line found. Revert Fake Patching!"
                  sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android12" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.10" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android13" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "5.15" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
                
                if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                  echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
                  sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
                fi
              fi
              if [ "${{ github.event.client_payload.ANDROID_VERSION }}" = "android14" ] && [ "${{ github.event.client_payload.KERNEL_VERSION }}" = "6.1" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            echo "鉁?SUSFS patches applied"
          else
            echo "馃摝 搴旂敤MANUAL_HOOK琛ヤ竵..."
            patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch
          fi

