#!/bin/bash
set -e

KERNEL_NAME="Ace5-SukiSU-SUSFS"

# 1. 创建目录
mkdir -p ~/ace5-build && cd ~/ace5-build

# 2. 拉源码
git clone https://github.com/AviumUI-Devices/kernel_oneplus_sm8650.git
cd kernel_oneplus_sm8650
git checkout lineage-22.2

# 3. SUSFS 补丁
cd ..
git clone --depth 3 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1

# 4. 集成 SukiSU Ultra
cd kernel_oneplus_sm8650
curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

# 5. 集成 SUSFS
cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
cp ../susfs4ksu/kernel_patches/*add_susfs*.patch . 2>/dev/null || \
  cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-6.1.patch .

cp ../susfs4ksu/kernel_patches/fs/* fs/
cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

# 打补丁
cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch; cd ..
patch -p1 < *add_susfs*.patch 2>/dev/null || patch -p1 < 50_add_susfs_in_kernel-6.1.patch

# 6. defconfig
cat >> arch/arm64/configs/gki_defconfig <<'EOF'
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
EOF

# 7. 编译
cd ~/ace5-build
git clone https://github.com/SPLOACK/oppo_oplus_realme_sm8650.git build-script
cd build-script
./Build_sm8650.sh

# 8. 打包 AK3
cd ~/ace5-build
git clone https://github.com/osm0sis/AnyKernel3.git AK3
cp kernel_oneplus_sm8650/out/Image.gz-dtb AK3/

cat > AK3/anykernel.sh <<'EOF'
kernel.string=Ace5-SukiSU-SUSFS
do.devicecheck=1
device.name1=PKG110
do.modules=0
do.systemless=1
do.cleanup=1
is_slot_device=1
slot_select=auto
block=/dev/block/by-name/boot
ramdisk_compression=auto
patch_vbmeta_flag=auto
. tools/ak3-core.sh
EOF

cd AK3 && zip -r9 ../AK3_Ace5_SukiSU.zip * -x .git README.md

echo "编译完成: ~/ace5-build/AK3_Ace5_SukiSU.zip"
